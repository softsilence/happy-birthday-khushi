<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy 21st Birthday Khushi! 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Balloons */
    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 55px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatUp 8s infinite linear;
      opacity: 0.8;
      z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
    }

    /* Main Container */
    .card-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      width: 90%;
      max-width: 800px;
      border-radius: 30px;
      padding: 40px 20px;
      box-shadow: 0 20px 50px rgba(233, 30, 99, 0.3);
      text-align: center;
      position: relative;
      z-index: 10;
      border: 3px solid #fff;
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      color: #e91e63;
      text-shadow: 2px 2px 0px #ffb6c1;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #fff, 0 0 10px #ff1493; }
      to { text-shadow: 0 0 20px #fff, 0 0 30px #ff1493; }
    }

    .profile-card {
      margin: 20px auto;
      display: inline-block;
      position: relative;
    }
    .profile-img {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #e91e63;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.4s ease;
    }
    .profile-img:hover {
      transform: scale(1.08) rotate(3deg);
    }

    /* Interactive Cake */
    .cake-box {
      margin: 20px auto;
      cursor: pointer;
      display: inline-block;
    }
    .cake {
      font-size: 70px;
      animation: bounce 1.5s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .btn-surprise {
      background: linear-gradient(45deg, #ff4081, #e91e63);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
      transition: all 0.3s ease;
      margin-top: 15px;
    }
    .btn-surprise:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      z-index: 100;
      max-width: 450px;
      width: 85%;
      text-align: center;
      border: 4px solid #ff4081;
      animation: modalOpen 0.4s ease;
    }
    @keyframes modalOpen {
      from { opacity: 0; transform: translate(-50%, -60%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    .modal h2 {
      color: #e91e63;
      font-family: 'Fredoka One', cursive;
      margin-bottom: 10px;
    }
    .modal p {
      color: #444;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .close-btn {
      background: #e91e63;
      color: white;
      border: none;
      padding: 8px 22px;
      border-radius: 20px;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Floating Balloons -->
  <div class="balloon" style="left: 10%; background: #ff4081; animation-delay: 0s;"></div>
  <div class="balloon" style="left: 30%; background: #ffeb3b; animation-delay: 2s;"></div>
  <div class="balloon" style="left: 60%; background: #00e676; animation-delay: 4s;"></div>
  <div class="balloon" style="left: 85%; background: #00bcd4; animation-delay: 1s;"></div>

  <div class="card-container">
    <h1>🎉 Happy 21st Birthday Khushi! 🎂</h1>
    
    <div class="profile-card">
      <img src="https://i.ibb.co/vvcgThDZ/image.png" alt="Khushi" class="profile-img">
    </div>

    <p style="font-size: 1.1rem; color: #555; font-weight: 600;">Tap the Birthday Cake to Blow Candles! 🕯️</p>

    <div class="cake-box" onclick="blowCandles()">
      <div class="cake" id="cakeEmoji">🎂</div>
    </div>

    <div>
      <button class="btn-surprise" onclick="openMessage()">Open Birthday Wishes 💌</button>
    </div>
  </div>

  <!-- Birthday Wish Modal -->
  <div class="modal" id="wishModal">
    <h2>Special Wish For Khushi ✨</h2>
    <p>Dear Khushi,<br><br>Happy 21st Birthday! May your day be filled with endless smiles, fun, and sweetness. Wishing you success and happiness in everything you do! 💖</p>
    <button class="close-btn" onclick="closeMessage()">Close 💕</button>
  </div>

  <script>
    // Trigger Confetti Fireworks on Load
    window.onload = function() {
      fireworks();
    };

    function fireworks() {
      var duration = 3 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    function blowCandles() {
      document.getElementById('cakeEmoji').innerHTML = '🍰';
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      alert('Yay! Candles blown! Make a wish Khushi! ✨');
    }

    function openMessage() {
      document.getElementById('wishModal').style.display = 'block';
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
    }

    function closeMessage() {
      document.getElementById('wishModal').style.display = 'none';
    }
  </script>
</body>
</html>
